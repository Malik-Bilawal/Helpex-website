{% load static %}

<!-- ========== ENHANCED NAVIGATION (LIGHT THEME) ========== -->
<nav id="navbar" class="navbar fixed top-0 left-0 w-full" style="z-index: 9999;">
  <div class="max-w-7xl mx-auto px-4">
    <div class="navbar-inner flex justify-between" style="background: rgba(255,255,255,0.6); border: 1px solid rgba(40,161,151,0.15);">
      <!-- Logo -->
      <a href="{% url 'index' %}" class="navbar-logo">
        <img src="{% static 'logo.png' %}" alt="HELPEX">
        <div class="navbar-brand">
          <span class="navbar-brand-main" style="color: #1A1F3B;">HELPEX<span style="color: #28A197;">.</span></span>
          <span class="navbar-brand-sub" style="color: #28A197;">BRO</span>
        </div>
      </a>

      <!-- Desktop Menu -->
      <div class="hidden lg:flex items-center gap-6" style="position: absolute; left: 50%; transform: translateX(-50%);">
        <a href="{% url 'index' %}" class="nav-link {% if request.path == '/' %}active{% endif %}" style="color: #1A1F3B;">Home</a>
        <a href="{% url 'service' %}" class="nav-link {% if request.path == '/service/' %}active{% endif %}" style="color: #1A1F3B;">Services</a>
        <a href="{% url 'gallery' %}" class="nav-link {% if request.path == '/gallery/' %}active{% endif %}" style="color: #1A1F3B;">Gallery</a>
        <a href="{% url 'clients' %}" class="nav-link {% if request.path == '/clients/' %}active{% endif %}" style="color: #1A1F3B;">Clients</a>
        <a href="{% url 'blog' %}" class="nav-link {% if request.path == '/blog/' %}active{% endif %}" style="color: #1A1F3B;">Blog</a>
        <a href="{% url 'about' %}" class="nav-link {% if request.path == '/about/' %}active{% endif %}" style="color: #1A1F3B;">About Us</a>
        <a href="{% url 'contact' %}" class="nav-link {% if request.path == '/contact/' %}active{% endif %}" style="color: #1A1F3B;">Contact</a>
      </div>

      <!-- CTA on right (only on desktop) -->
      <a href="{% url 'contact' %}" class="navbar-cta hidden lg:inline-flex" style="margin-left: auto; display: none;">
        Start Project
        <i class="fas fa-arrow-right"></i>
      </a>
      <style>
        @media (min-width: 1024px) {
          .navbar-cta { display: inline-flex !important; }
        }
      </style>

      <!-- Mobile Toggle - ONLY SHOW ON MOBILE -->
      <button id="menuBtn" type="button" onclick="document.getElementById('mobileMenu').style.right='0'; document.getElementById('mobileOverlay').style.opacity='1';" style="display:none; width:44px; height:44px; background:#28A197 !important; color:#fff !important; border:2px solid #1A1F3B !important; border-radius:8px; font-size:18px; cursor:pointer; z-index:999999 !important; position:absolute; right:10px; top:50%; transform:translateY(-50%);">
        <i class="fas fa-bars"></i>
      </button>
      <style>
        @media (max-width: 1023px) {
          #menuBtn { display: block !important; }
        }
      </style>
    </div>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
<div id="mobileOverlay" onclick="document.getElementById('mobileMenu').style.right='-100%'; this.style.opacity='0';" class="mobile-menu-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9998; opacity: 0; visibility: hidden; transition: all 0.3s;"></div>

<!-- Mobile Menu (80% width, light theme) -->
<div id="mobileMenu" class="mobile-menu" style="position: fixed; top: 0; right: -100%; width: 80%; max-width: 400px; height: 100vh; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); z-index: 9999; transition: right 0.4s;">
  <div class="mobile-menu-header">
    <a href="{% url 'index' %}" class="navbar-logo">
      <img src="{% static 'logo.png' %}" alt="HELPEX">
      <div class="navbar-brand">
        <span class="navbar-brand-main" style="color: #1A1F3B;">HELPEX<span style="color: #28A197;">.</span></span>
        <span class="navbar-brand-sub" style="color: #28A197;">BRO</span>
      </div>
    </a>
    <button id="closeMenu" onclick="document.getElementById('mobileMenu').style.right='-100%'; document.getElementById('mobileOverlay').style.opacity='0';" class="mobile-menu-close" style="background: rgba(26,31,59,0.1); color: #1A1F3B;">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <div class="mobile-menu-content">
    <a href="{% url 'index' %}" class="mobile-nav-link {% if request.path == '/' %}active{% endif %}" style="color: #1A1F3B;">Home</a>
    <a href="{% url 'service' %}" class="mobile-nav-link {% if request.path == '/service/' %}active{% endif %}" style="color: #1A1F3B;">Services</a>
    <a href="{% url 'gallery' %}" class="mobile-nav-link {% if request.path == '/gallery/' %}active{% endif %}" style="color: #1A1F3B;">Gallery</a>
    <a href="{% url 'clients' %}" class="mobile-nav-link {% if request.path == '/clients/' %}active{% endif %}" style="color: #1A1F3B;">Clients</a>
    <a href="{% url 'blog' %}" class="mobile-nav-link {% if request.path == '/blog/' %}active{% endif %}" style="color: #1A1F3B;">Blog</a>
    <a href="{% url 'about' %}" class="mobile-nav-link {% if request.path == '/about/' %}active{% endif %}" style="color: #1A1F3B;">About Us</a>
    <a href="{% url 'contact' %}" class="mobile-nav-link {% if request.path == '/contact/' %}active{% endif %}" style="color: #1A1F3B;">Contact</a>
    <a href="{% url 'contact' %}" class="mobile-menu-cta">
      Start Project
      <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</div>

<script>
  (function() {
    if (window.navbarMobileInit) return;
    window.navbarMobileInit = true;
    
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const menuBtn = document.getElementById('menuBtn');
    const closeMenu = document.getElementById('closeMenu');
    
    if (!menuBtn || !mobileMenu) return;
    
    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.add('active');
      if (mobileOverlay) mobileOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    });
    
    const closeMenuFn = () => {
      mobileMenu.classList.remove('active');
      if (mobileOverlay) mobileOverlay.classList.remove('active');
      document.body.style.overflow = '';
    };
    
    if (closeMenu) closeMenu.addEventListener('click', closeMenuFn);
    if (mobileOverlay) mobileOverlay.addEventListener('click', closeMenuFn);
    
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', closeMenuFn);
    });
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && mobileMenu.classList.contains('active')) {
        closeMenuFn();
      }
    });
  })();
</script>
