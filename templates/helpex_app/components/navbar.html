{% load static %}

<!-- ========== PROFESSIONAL NAVBAR ========== -->
<nav class="navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a href="{% url 'index' %}" class="navbar-logo">
      <img src="{% static 'logo.png' %}" alt="HELPEX">
      <div class="navbar-brand">
        <span class="brand-main">HELPEX<span>.</span></span>
        <span class="brand-sub">BRO</span>
      </div>
    </a>

    <!-- Desktop Menu -->
    <ul class="navbar-menu">
      <li><a href="{% url 'index' %}" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a></li>
      <li><a href="{% url 'service' %}" class="nav-link {% if request.path == '/service/' %}active{% endif %}">Services</a></li>
      <li><a href="{% url 'gallery' %}" class="nav-link {% if request.path == '/gallery/' %}active{% endif %}">Gallery</a></li>
      <li><a href="{% url 'clients' %}" class="nav-link {% if request.path == '/clients/' %}active{% endif %}">Clients</a></li>
      <li><a href="{% url 'blog' %}" class="nav-link {% if request.path == '/blog/' %}active{% endif %}">Blog</a></li>
      <li><a href="{% url 'pricing' %}" class="nav-link {% if request.path == '/pricing/' %}active{% endif %}">Pricing</a></li>
      <li><a href="{% url 'why_choose_us' %}" class="nav-link {% if request.path == '/why-choose-us/' %}active{% endif %}">Why Choose Us</a></li>
      <li><a href="{% url 'about' %}" class="nav-link {% if request.path == '/about/' %}active{% endif %}">About Us</a></li>
      <li><a href="{% url 'contact' %}" class="nav-link {% if request.path == '/contact/' %}active{% endif %}">Contact</a></li>
    </ul>

    <!-- CTA Button -->
    <a href="{% url 'contact' %}" class="navbar-cta">
      Start Project <i class="fas fa-arrow-right"></i>
    </a>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" aria-label="Toggle menu" onclick="toggleMobileMenu()">
      <span class="hamburger"></span>
    </button>
  </div>
</nav>

<!-- Mobile Menu Overlay -->
<div class="mobile-overlay" id="mobileOverlay" onclick="closeMobileMenu()"></div>

<!-- Mobile Menu -->
<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-header">
    <a href="{% url 'index' %}" class="navbar-logo" onclick="closeMobileMenu()">
      <img src="{% static 'logo.png' %}" alt="HELPEX">
      <div class="navbar-brand">
        <span class="brand-main">HELPEX<span>.</span></span>
        <span class="brand-sub">BRO</span>
      </div>
    </a>
    <button class="mobile-close" onclick="closeMobileMenu()" aria-label="Close menu">
      <i class="fas fa-times"></i>
    </button>
  </div>
  
  <div class="mobile-content">
    <a href="{% url 'index' %}" class="mobile-link {% if request.path == '/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-home"></i> Home
    </a>
    <a href="{% url 'service' %}" class="mobile-link {% if request.path == '/service/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-cog"></i> Services
    </a>
    <a href="{% url 'gallery' %}" class="mobile-link {% if request.path == '/gallery/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-images"></i> Gallery
    </a>
    <a href="{% url 'clients' %}" class="mobile-link {% if request.path == '/clients/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-users"></i> Clients
    </a>
    <a href="{% url 'blog' %}" class="mobile-link {% if request.path == '/blog/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-blog"></i> Blog
    </a>
    <a href="{% url 'pricing' %}" class="mobile-link {% if request.path == '/pricing/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-tags"></i> Pricing
    </a>
    <a href="{% url 'why_choose_us' %}" class="mobile-link {% if request.path == '/why-choose-us/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-award"></i> Why Choose Us
    </a>
    <a href="{% url 'about' %}" class="mobile-link {% if request.path == '/about/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-info-circle"></i> About Us
    </a>
    <a href="{% url 'contact' %}" class="mobile-link {% if request.path == '/contact/' %}active{% endif %}" onclick="closeMobileMenu()">
      <i class="fas fa-envelope"></i> Contact
    </a>
    <a href="{% url 'contact' %}" class="mobile-cta" onclick="closeMobileMenu()">
      Start Project <i class="fas fa-arrow-right"></i>
    </a>
  </div>
</div>

<style>
  /* ========== NAVBAR STYLES ========== */
  :root {
    --nav-midnight: #1A1F3B;
    --nav-teal: #28A197;
    --nav-teal-dark: #1E837A;
    --nav-teal-light: #3BC4B5;
    --nav-white: #FFFFFF;
    --nav-gray-100: #F8FAFC;
    --nav-gray-200: #E2E8F0;
    --nav-gray-500: #64748B;
  }

  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    height: 80px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(40,161,151,0.1);
  }

  .navbar-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1.5rem;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Logo */
  .navbar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .navbar-logo img {
    height: 44px;
    width: auto;
    border-radius: 12px;
    object-fit: contain;
  }

  .navbar-brand {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .brand-main {
    font-size: 22px;
    font-weight: 800;
    color: var(--nav-midnight);
    letter-spacing: -0.5px;
  }

  .brand-main span {
    color: var(--nav-teal);
  }

  .brand-sub {
    font-size: 9px;
    font-weight: 700;
    color: var(--nav-teal);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Desktop Menu */
  .navbar-menu {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .nav-link {
    position: relative;
    display: block;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 500;
    color: var(--nav-midnight);
    text-decoration: none;
    transition: color 0.3s ease;
    border-radius: 8px;
  }

  .nav-link::after {
    content: '';
    position: absolute;
    bottom: 6px;
    left: 16px;
    right: 16px;
    height: 2px;
    background: var(--nav-teal);
    transform: scaleX(0);
    transition: transform 0.3s ease;
  }

  .nav-link:hover,
  .nav-link.active {
    color: var(--nav-teal);
  }

  .nav-link:hover::after,
  .nav-link.active::after {
    transform: scaleX(1);
  }

  /* CTA Button */
  .navbar-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--nav-teal), var(--nav-teal-dark));
    color: var(--nav-white);
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(40,161,151,0.3);
    flex-shrink: 0;
  }

  .navbar-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(40,161,151,0.4);
  }

  .navbar-cta i {
    font-size: 12px;
    transition: transform 0.3s ease;
  }

  .navbar-cta:hover i {
    transform: translateX(4px);
  }

  /* Mobile Toggle */
  .mobile-toggle {
    display: none;
    width: 44px;
    height: 44px;
    background: var(--nav-teal);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
  }

  .hamburger {
    display: block;
    width: 20px;
    height: 2px;
    background: white;
    position: relative;
    transition: all 0.3s ease;
  }

  .hamburger::before,
  .hamburger::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 2px;
    background: white;
    left: 0;
    transition: all 0.3s ease;
  }

  .hamburger::before { top: -6px; }
  .hamburger::after { bottom: -6px; }

  /* Mobile Overlay */
  .mobile-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 9998;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .mobile-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  /* Mobile Menu */
  .mobile-menu {
    position: fixed;
    top: 0;
    right: -100%;
    width: 85%;
    max-width: 400px;
    height: 100vh;
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 9999;
    transition: right 0.4s ease;
    display: flex;
    flex-direction: column;
  }

  .mobile-menu.active {
    right: 0;
  }

  .mobile-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--nav-gray-200);
    flex-shrink: 0;
  }

  .mobile-close {
    width: 40px;
    height: 40px;
    background: var(--nav-gray-100);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--nav-midnight);
    transition: all 0.3s ease;
  }

  .mobile-close:hover {
    background: var(--nav-teal);
    color: white;
  }

  .mobile-content {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    overflow-y: auto;
    flex: 1;
  }

  .mobile-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    font-weight: 500;
    font-size: 16px;
    color: var(--nav-midnight);
    text-decoration: none;
    transition: all 0.3s ease;
  }

  .mobile-link i {
    width: 20px;
    text-align: center;
    color: var(--nav-gray-500);
    transition: color 0.3s ease;
  }

  .mobile-link:hover,
  .mobile-link.active {
    background: rgba(40,161,151,0.1);
    color: var(--nav-teal);
  }

  .mobile-link:hover i,
  .mobile-link.active i {
    color: var(--nav-teal);
  }

  .mobile-cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 1rem;
    padding: 16px 24px;
    background: linear-gradient(135deg, var(--nav-teal), var(--nav-teal-dark));
    color: white;
    border-radius: 50px;
    font-weight: 600;
    font-size: 16px;
    text-decoration: none;
    text-align: center;
  }

  .mobile-cta:hover {
    box-shadow: 0 8px 25px rgba(40,161,151,0.4);
  }

  /* Responsive */
  @media (max-width: 1023px) {
    .navbar-menu,
    .navbar-cta {
      display: none;
    }

    .mobile-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-toggle.active .hamburger {
      background: transparent;
    }

    .mobile-toggle.active .hamburger::before {
      top: 0;
      transform: rotate(45deg);
    }

    .mobile-toggle.active .hamburger::after {
      bottom: 0;
      transform: rotate(-45deg);
    }
  }

  @media (max-width: 640px) {
    .navbar-container {
      padding: 0 1rem;
    }

    .navbar-logo img {
      height: 38px;
    }

    .brand-main {
      font-size: 18px;
    }

    .mobile-menu {
      width: 100%;
      max-width: none;
    }
  }
</style>

<script>
  function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('mobileOverlay');
    const toggle = document.querySelector('.mobile-toggle');
    
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
    toggle.classList.toggle('active');
    document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : '';
  }

  function closeMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('mobileOverlay');
    const toggle = document.querySelector('.mobile-toggle');
    
    menu.classList.remove('active');
    overlay.classList.remove('active');
    toggle.classList.remove('active');
    document.body.style.overflow = '';
  }

  // Close on escape key
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeMobileMenu();
    }
  });

  // Close on resize to desktop
  window.addEventListener('resize', () => {
    if (window.innerWidth > 1023) {
      closeMobileMenu();
    }
  });
</script>
